{% extends "main/base.html" %}

{% block page_title %}Unauthorized{% endblock page_title %}

{% block content %}
    <div class="error-page">
        <div>
            <i class="material-icons-outlined theme-failure-text" style="font-size: 3rem">lock</i>
            <p class="error-page__msg">This account is not in the access group allowed to view this page.</p>
            <a class="btn btn--ghost" href="javascript:history.back()">Go back</a>
            <a class="btn" href="{{ url_for('user_system.login') }}">Sign in</a>
        </div>
    </div>
{% endblock content %}
