{% extends "main/layout.html" %}

{% block page_title %}{{ title }}{% endblock page_title %}

{% block page_lvl_css %}
    <style>
        .app-frame {
            flex: 1 1 auto;
            min-height: 0;
            background: var(--theme-surface);
        }
        .app-frame iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 57px);
            border: 0;
        }
    </style>
{% endblock page_lvl_css %}

{% block content %}
    <div class="app-frame">
        <iframe src="{{ url }}" title="{{ title }}" loading="eager"></iframe>
    </div>
{% endblock content %}

{% block page_lvl_js %}
{% endblock page_lvl_js %}
